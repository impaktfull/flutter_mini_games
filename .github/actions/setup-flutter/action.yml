name: Setup Flutter
description: Installs the Flutter version pinned in .fvmrc and gets the package and example dependencies

runs:
  using: composite
  steps:
    - name: Read the Flutter version from .fvmrc
      id: version
      shell: bash
      run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.version.outputs.flutter }}
        channel: stable
        cache: true
    - shell: bash
      run: flutter pub get
    - name: Get example dependencies
      shell: bash
      working-directory: example
      run: flutter pub get
