name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Self-hosted runners of the impaktfull organisation (macOS, no Docker)
    runs-on: impaktfull-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure PATH
        run: |
          source ~/.impaktfull/impaktfull_cli/.zshrc-ci
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - run: fvm install
      - run: fvm flutter pub get
      - name: Get example dependencies
        working-directory: example
        run: fvm flutter pub get
      - name: Format
        run: fvm dart format --line-length=180 --output=none --set-exit-if-changed .
      - name: Analyze
        run: fvm dart analyze --fatal-infos
      - name: Test
        run: fvm flutter test
      # Unused games must never end up in a host app
      - name: Tree shaking
        run: FLUTTER="fvm flutter" ./tool/check_tree_shaking.sh
