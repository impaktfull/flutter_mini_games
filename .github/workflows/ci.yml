name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # The publish workflow runs the same checks on the release tag
  workflow_call:

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Format
        run: dart format --line-length=180 --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Test example
        working-directory: example
        run: flutter test
      - name: Publish dry run
        run: flutter pub publish --dry-run

  # Unused games must never end up in a host app (builds one web app per game, runs beside the checks).
  # The size each game adds to an app is printed and added to the job summary.
  tree-shaking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Tree shaking
        run: SIZE_REPORT="$GITHUB_STEP_SUMMARY" ./tool/check_tree_shaking.sh
