name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Self-hosted runners of the impaktfull organisation (macOS, no Docker)
    runs-on: impaktfull-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # No subosito/flutter-action: the runner is persistent and keeps fvm's
      # Flutter SDKs, so fvm installs the version pinned in .fvmrc once.
      - name: Configure PATH
        run: |
          source ~/.impaktfull/impaktfull_cli/.zshrc-ci
          echo "PATH=$PATH" >> "$GITHUB_ENV"
      - run: fvm install
      - run: fvm flutter pub get
      - name: Get dependencies
        working-directory: example
        run: fvm flutter pub get
      - name: Build web
        working-directory: example
        run: fvm flutter build web --release --base-href "/flutter_mini_games/"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      # upload-pages-artifact needs GNU tar (gtar) on macOS
      - name: Install GNU tar
        run: brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
