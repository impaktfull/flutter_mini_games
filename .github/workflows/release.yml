name: Release

# Keeps the release PR up to date with the conventional commits on main. Merging that PR
# tags the release, and this workflow then starts the publish workflow on the tag.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A tag pushed with the GITHUB_TOKEN does not trigger workflows, a workflow_dispatch does.
      # pub.dev accepts it because it runs on the tag ("Enable publishing from workflow_dispatch events").
      - name: Publish the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
